extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.6", import: ["@key"])

scalar DateTime

enum ModerationAction {
  DISMISS
  WARN
  REQUEST_CHANGES
  REMOVE
  RESTORE
  SUSPEND
  REACTIVATE
  ESCALATE
  RESOLVE
  REOPEN
}

enum AuditAction {
  ASSIGN
  ADD_NOTE
  DISMISS
  WARN
  REMOVE
  REQUEST_CHANGES
  RESTORE
  SUSPEND
  REACTIVATE
  ESCALATE
  CHANGE_PRIORITY
  RESOLVE
  REOPEN
  SEND_REPORT_MESSAGE
  REPORT_REPLY
  APPEAL_SUBMIT
  APPEAL_UPHOLD
  APPEAL_OVERTURN
  APPEAL_NEEDS_INFORMATION
  ACCESS_DOCUMENT
  ACCESS_PRIVATE_DATA
  VERIFICATION_ASSIGN
  VERIFICATION_APPROVE
  VERIFICATION_REJECT
  VERIFICATION_NEEDS_INFORMATION
  ACCOUNT_WARN
  ACCOUNT_SUSPEND
  ACCOUNT_REACTIVATE
  EVENT_CANCEL
  EVENT_RESTORE
  REQUEST_AUDIT_EXPORT
  DOWNLOAD_AUDIT_EXPORT
  TEMPLATE_CREATE
  TEMPLATE_ACTIVATE
  PLACEMENT_CREATE
  PLACEMENT_UPDATE
  PLACEMENT_PAUSE
  PLACEMENT_DUPLICATE
  PLACEMENT_REORDER
  SAVED_VIEW_CREATE
  SAVED_VIEW_DELETE
  NOTIFICATION_READ
  EMAIL_RETRY
  EMAIL_TEST
  AI_RISK_RETRY
  AI_RISK_REVIEW
}

enum ContentType {
  MARKETPLACE_ITEM
  ORGANISATION_VERIFICATION
  USER
  ORGANISATION
  EVENT
  JOB
  AUDIT_EXPORT
  TEMPLATE
  FEATURED_PLACEMENT
  SAVED_VIEW
  EMAIL_DELIVERY
}

enum AuditResult { SUCCESS FAILED }
enum AdminTemplateType { WARNING REJECTION REMOVAL SUSPENSION VERIFICATION }
enum PlacementTargetType { EVENT JOB MARKETPLACE_ITEM ORGANISATION ANNOUNCEMENT }
enum PlacementStatus { SCHEDULED ACTIVE PAUSED EXPIRED }
enum PlacementSource { EDITORIAL PROMOTION }
enum AdminSortDirection { ASC DESC }
enum SavedViewModule { MODERATION VERIFICATION AUDIT DIRECTORY CURATION }
enum AdminNotificationType { ASSIGNMENT SLA_WARNING ESCALATION ACTION_FAILED MENTION }
enum AuditExportStatus { PENDING READY FAILED EXPIRED }
enum EmailDeliveryStatus { QUEUED ACCEPTED SENT FAILED SUPPRESSED }
enum RiskAnalysisStatus { PENDING PROCESSING COMPLETED FAILED SKIPPED }
enum RiskLevel { LOW MEDIUM HIGH }
enum RiskRecommendedAction { NONE REVIEW PENDING_REVIEW }
enum RiskReviewVerdict { ACCURATE FALSE_POSITIVE NEEDS_MORE_INFO }

enum VerificationReviewStatus { PENDING_REVIEW NEEDS_INFORMATION APPROVED REJECTED }
enum VerificationDecision { APPROVE REJECT NEEDS_INFORMATION }
enum VerificationTier { NONE STANDARD CHARITY NGO }
enum DirectoryEntityType { USER ORGANISATION EVENT JOB MARKETPLACE_ITEM }
enum AccountAction { WARN SUSPEND REACTIVATE }
enum EventAdminAction { CANCEL RESTORE }
enum EventActionScope { OCCURRENCE SERIES }

enum ModerationCaseStatus {
  OPEN
  PENDING_REVIEW
  APPEAL_PENDING
  RESOLVED
}

enum ReportConversationAudience { REPORTER OWNER }
enum ReportConversationStatus { OPEN RESOLVED APPEAL_PENDING }
enum ReportMessageAuthorType { ADMIN PARTICIPANT SYSTEM }
enum ReportAppealStatus { PENDING UPHELD OVERTURNED NEEDS_INFORMATION }
enum ReportAppealDecision { UPHOLD OVERTURN NEEDS_INFORMATION }

enum ModerationPriority {
  NORMAL
  HIGH
  CRITICAL
}

enum ReportReasonCode {
  SPAM_MISLEADING
  FRAUD_SCAM
  PROHIBITED_UNSAFE
  INAPPROPRIATE
  DUPLICATE
  OTHER
}

type ModerationReport @key(fields: "id") {
  id: ID!
  reporterFirebaseUid: String!
  reasonCode: ReportReasonCode!
  details: String
  createdAt: DateTime!
}

type CaseNote @key(fields: "id") {
  id: ID!
  authorFirebaseUid: String!
  body: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReportMessage @key(fields: "id") {
  id: ID!
  authorType: ReportMessageAuthorType!
  body: String!
  templateKey: String
  createdAt: DateTime!
}

type ReportAppeal @key(fields: "id") {
  id: ID!
  body: String!
  status: ReportAppealStatus!
  decisionReason: String
  decidedAt: DateTime
  createdAt: DateTime!
}

type ReportConversation @key(fields: "id") {
  id: ID!
  caseId: ID!
  reportId: ID
  audience: ReportConversationAudience!
  subject: String!
  targetId: String!
  targetType: ContentType!
  targetTitle: String!
  status: ReportConversationStatus!
  unread: Boolean!
  messages: [ReportMessage!]!
  appeals: [ReportAppeal!]!
  lastMessageAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AuditEvent @key(fields: "id") {
  id: ID!
  adminFirebaseUid: String!
  action: AuditAction!
  targetId: String!
  targetType: ContentType!
  reason: String!
  beforeStatus: String
  afterStatus: String
  requestId: String
  adminRoles: [String!]!
  result: AuditResult!
  route: String
  ipAddress: String
  userAgent: String
  createdAt: DateTime!
}

type AuditExport @key(fields: "id") { id: ID! requesterFirebaseUid: String! requesterEmail: String! from: DateTime! to: DateTime! status: AuditExportStatus! rowCount: Int! failureReason: String expiresAt: DateTime! createdAt: DateTime! updatedAt: DateTime! }
type AdminTemplate @key(fields: "id") { id: ID! key: String! type: AdminTemplateType! title: String! publicMessage: String! internalGuidance: String locale: String! version: Int! active: Boolean! createdByFirebaseUid: String! createdAt: DateTime! updatedAt: DateTime! history: [AdminTemplate!]! }
type FeaturedPlacement @key(fields: "id") { id: ID! targetType: PlacementTargetType! targetId: String regions: [String!]! rank: Int! label: String! title: String! imageUrl: String imageAlt: String destinationUrl: String! startsAt: DateTime! endsAt: DateTime! status: PlacementStatus! placementSource: PlacementSource! createdByFirebaseUid: String! updatedByFirebaseUid: String! createdAt: DateTime! updatedAt: DateTime! }
type AdminTemplateConnection { edges: [AdminTemplate!]! totalCount: Int! hasNextPage: Boolean! endCursor: String }
type FeaturedPlacementConnection { edges: [FeaturedPlacement!]! totalCount: Int! hasNextPage: Boolean! endCursor: String }
type SavedAdminView @key(fields: "id") { id: ID! name: String! module: SavedViewModule! filtersJson: String! createdAt: DateTime! updatedAt: DateTime! }
type AdminNotification @key(fields: "id") { id: ID! type: AdminNotificationType! title: String! message: String! href: String readAt: DateTime createdAt: DateTime! }
type SystemDependency { name: String! category: String! status: String! detail: String! latencyMs: Int checkedAt: DateTime! }
type AdminSystemHealth { overallStatus: String! version: String! dependencies: [SystemDependency!]! checkedAt: DateTime! }

type ModerationCase @key(fields: "id") {
  id: ID!
  targetId: String!
  targetType: ContentType!
  title: String!
  ownerFirebaseUid: String!
  organisationId: String
  status: ModerationCaseStatus!
  priority: ModerationPriority!
  reportCount: Int!
  reasonCodes: [ReportReasonCode!]!
  assigneeFirebaseUid: String
  targetStatus: String!
  previousStatus: String
  resolutionAction: ModerationAction
  resolutionReason: String
  resolvedByFirebaseUid: String
  resolvedAt: DateTime
  version: Int!
  reports: [ModerationReport!]!
  notes: [CaseNote!]!
  conversations: [ReportConversation!]!
  appeals: [ReportAppeal!]!
  unreadCommunicationCount: Int!
  auditTimeline: [AuditEvent!]!
  riskAnalyses: [ContentRiskAnalysis!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ModerationCaseConnection {
  edges: [ModerationCase!]!
  totalCount: Int!
  hasNextPage: Boolean!
  endCursor: String
}

type AuditEventConnection {
  edges: [AuditEvent!]!
  totalCount: Int!
  hasNextPage: Boolean!
  endCursor: String
}

type VerificationSubmission @key(fields: "id") {
  id: ID!
  organisationId: String!
  organisationName: String!
  ownerFirebaseUid: String!
  version: Int!
  status: VerificationReviewStatus!
  requestedTier: VerificationTier!
  approvedTier: VerificationTier
  documentLabels: [String!]!
  officialName: String
  registrationNumber: String
  officialEmail: String
  pocName: String
  pocTitle: String
  organisationType: String
  region: String
  assigneeFirebaseUid: String
  decisionReason: String
  reviewedByFirebaseUid: String
  reviewedAt: DateTime
  dueAt: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
  history: [VerificationSubmission!]!
  auditTimeline: [AuditEvent!]!
}

type VerificationSubmissionConnection { edges: [VerificationSubmission!]! totalCount: Int! hasNextPage: Boolean! endCursor: String }

type AdminDirectoryItem @key(fields: "id") {
  id: ID!
  sourceId: ID!
  type: DirectoryEntityType!
  title: String!
  subtitle: String
  status: String!
  region: String
  ownerFirebaseUid: String
  organisationId: String
  seriesId: String
  createdAt: DateTime!
  privateSummary: String
}

type AdminDirectoryConnection { edges: [AdminDirectoryItem!]! totalCount: Int! hasNextPage: Boolean! endCursor: String }

type AdminDashboardStats {
  openModerationCases: Int!
  pendingVerifications: Int!
  overdueVerifications: Int!
  resolvedModerationLast7Days: Int!
  verificationDecisionsLast7Days: Int!
}

type EmailDeliveryEvent { event: String! occurredAt: DateTime! response: String }
type EmailDelivery {
  id: ID!
  templateKey: String!
  to: String!
  subject: String!
  status: EmailDeliveryStatus!
  provider: String!
  providerMessageId: String
  error: String
  attemptCount: Int!
  sourceService: String
  sourceEntityType: String
  sourceEntityId: String
  queuedAt: DateTime
  sentAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  events: [EmailDeliveryEvent!]!
}
type EmailDeliveryConnection { edges: [EmailDelivery!]! totalCount: Int! hasNextPage: Boolean! endCursor: String }
type EmailDeliveryConfiguration { enabled: Boolean! provider: String! webhookConfigured: Boolean! }
type ContentRiskSignal { code: String! confidence: Float! explanation: String! evidenceExcerpt: String }
type ContentRiskAnalysis {
  id: ID!
  targetId: String!
  targetType: ContentType!
  title: String!
  mode: String!
  status: RiskAnalysisStatus!
  provider: String!
  model: String!
  score: Int
  level: RiskLevel
  summary: String
  recommendedAction: RiskRecommendedAction
  signals: [ContentRiskSignal!]!
  error: String
  attemptCount: Int!
  reviewerVerdict: RiskReviewVerdict
  reviewerNote: String
  reviewedByFirebaseUid: String
  reviewedAt: DateTime
  completedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}
type ContentRiskAnalysisConnection { edges: [ContentRiskAnalysis!]! totalCount: Int! hasNextPage: Boolean! endCursor: String }
type ContentRiskAnalysisConfiguration { enabled: Boolean! provider: String! model: String! mode: String! }

type Query {
  myReportConversations: [ReportConversation!]!
  myReportUnreadCount: Int!
  organisationReportConversations(organisationId: ID!): [ReportConversation!]!
  organisationReportUnreadCount(organisationId: ID!): Int!
  reportConversation(id: ID!): ReportConversation
  moderationCases(
    status: ModerationCaseStatus
    priority: ModerationPriority
    assigneeFirebaseUid: String
    search: String
    limit: Int
    after: String
    offset: Int
    sortBy: String
    sortDirection: AdminSortDirection
  ): ModerationCaseConnection!
  moderationCase(id: ID!): ModerationCase
  auditEvents(caseId: ID, adminFirebaseUid: String, targetType: ContentType, action: AuditAction, result: AuditResult, from: DateTime, to: DateTime, search: String, limit: Int, after: String, offset: Int, sortBy: String, sortDirection: AdminSortDirection): AuditEventConnection!
  verificationSubmissions(status: VerificationReviewStatus, assigneeFirebaseUid: String, search: String, limit: Int, after: String, offset: Int, sortBy: String, sortDirection: AdminSortDirection): VerificationSubmissionConnection!
  verificationSubmission(id: ID!): VerificationSubmission
  adminDirectory(type: DirectoryEntityType!, search: String, limit: Int, after: String, offset: Int, sortBy: String, sortDirection: AdminSortDirection): AdminDirectoryConnection!
  adminDashboardStats: AdminDashboardStats!
  auditExports: [AuditExport!]!
  auditExportContent(id: ID!): String!
  adminTemplates(type: AdminTemplateType, activeOnly: Boolean): [AdminTemplate!]!
  featuredPlacements(status: PlacementStatus, region: String): [FeaturedPlacement!]!
  adminTemplatePage(type: AdminTemplateType, activeOnly: Boolean, search: String, limit: Int, offset: Int, sortBy: String, sortDirection: AdminSortDirection): AdminTemplateConnection!
  featuredPlacementPage(status: PlacementStatus, region: String, search: String, limit: Int, offset: Int, sortBy: String, sortDirection: AdminSortDirection): FeaturedPlacementConnection!
  savedAdminViews(module: SavedViewModule): [SavedAdminView!]!
  adminNotifications(unreadOnly: Boolean, limit: Int): [AdminNotification!]!
  adminNotificationUnreadCount: Int!
  adminSystemHealth: AdminSystemHealth!
  emailDeliveries(status: EmailDeliveryStatus, templateKey: String, search: String, limit: Int, after: String, offset: Int, sortBy: String, sortDirection: AdminSortDirection): EmailDeliveryConnection!
  emailDeliveryConfiguration: EmailDeliveryConfiguration!
  contentRiskAnalyses(status: RiskAnalysisStatus, level: RiskLevel, reviewerVerdict: RiskReviewVerdict, search: String, limit: Int, after: String, offset: Int, sortBy: String, sortDirection: AdminSortDirection): ContentRiskAnalysisConnection!
  contentRiskAnalysisConfiguration: ContentRiskAnalysisConfiguration!
}

type Mutation {
  submitContentReport(targetType: ContentType!, targetId: ID!, reason: String!, details: String): ReportConversation!
  sendReportConversationMessage(conversationId: ID!, body: String!): ReportMessage!
  markReportConversationRead(conversationId: ID!): Boolean!
  submitReportAppeal(conversationId: ID!, body: String!): ReportAppeal!
  sendAdminReportMessage(caseId: ID!, audience: ReportConversationAudience!, reportId: ID, body: String!, templateKey: String): ReportConversation!
  decideReportAppeal(appealId: ID!, decision: ReportAppealDecision!, reason: String!): ReportAppeal!
  assignModerationCase(id: ID!, assigneeFirebaseUid: String, expectedVersion: Int!): ModerationCase!
  setModerationCasePriority(id: ID!, priority: ModerationPriority!, expectedVersion: Int!): ModerationCase!
  addModerationCaseNote(caseId: ID!, body: String!): CaseNote!
  resolveModerationCase(
    id: ID!
    action: ModerationAction!
    reason: String!
    expectedVersion: Int!
    scope: EventActionScope
  ): ModerationCase!
  assignVerificationSubmission(id: ID!, assigneeFirebaseUid: String): VerificationSubmission!
  accessVerificationDocument(id: ID!, documentIndex: Int!): String!
  decideVerificationSubmission(id: ID!, action: VerificationDecision!, tier: VerificationTier, reason: String!): VerificationSubmission!
  applyAccountAction(type: DirectoryEntityType!, id: ID!, action: AccountAction!, reason: String!): AdminDirectoryItem!
  applyEventAction(id: ID!, action: EventAdminAction!, scope: EventActionScope!, reason: String!): Boolean!
  accessDirectoryPrivateData(type: DirectoryEntityType!, id: ID!, reason: String!): String!
  requestAuditExport(from: DateTime!, to: DateTime!): AuditExport!
  createAdminTemplate(key: String!, type: AdminTemplateType!, title: String!, publicMessage: String!, internalGuidance: String, locale: String): AdminTemplate!
  activateAdminTemplate(id: ID!): AdminTemplate!
  createFeaturedPlacement(input: FeaturedPlacementInput!): FeaturedPlacement!
  updateFeaturedPlacement(id: ID!, input: FeaturedPlacementInput!): FeaturedPlacement!
  pauseFeaturedPlacement(id: ID!, paused: Boolean!): FeaturedPlacement!
  duplicateFeaturedPlacement(id: ID!, startsAt: DateTime!, endsAt: DateTime!, rank: Int!): FeaturedPlacement!
  reorderFeaturedPlacement(id: ID!, rank: Int!): FeaturedPlacement!
  saveAdminView(name: String!, module: SavedViewModule!, filtersJson: String!): SavedAdminView!
  deleteSavedAdminView(id: ID!): Boolean!
  markAdminNotificationRead(id: ID!): AdminNotification!
  markAllAdminNotificationsRead: Boolean!
    retryEmailDelivery(id: ID!): EmailDelivery!
    sendTestEmail(to: String!): EmailDelivery!
    retryContentRiskAnalysis(id: ID!): ContentRiskAnalysis!
    reviewContentRiskAnalysis(id: ID!, verdict: RiskReviewVerdict!, note: String): ContentRiskAnalysis!
}

input FeaturedPlacementInput { targetType: PlacementTargetType! targetId: String regions: [String!]! rank: Int! label: String! title: String! imageUrl: String imageAlt: String destinationUrl: String! startsAt: DateTime! endsAt: DateTime! placementSource: PlacementSource = EDITORIAL }
