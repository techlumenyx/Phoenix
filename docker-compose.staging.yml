name: christian-listings-staging

# Staging compose — mirrors docker-compose.prod.yml exactly, except:
#   - distinct project name (isolated network + volume namespace, coexists with prod)
#   - :staging image tags (built from the `staging` branch, never :latest)
#   - host ports shifted to 5000-5004 so they don't collide with prod's 4000-4004
# Never runs `docker build`. Only pulls and runs, same as prod.

services:
  gateway:
    image: ghcr.io/techlumenyx/phoenix/gateway:staging
    ports:
      - "127.0.0.1:5000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - SUBGRAPH_IDENTITY_URL=http://identity:4001/graphql
      - SUBGRAPH_EVENTS_URL=http://events:4002/graphql
      - SUBGRAPH_CLASSIFIEDS_URL=http://classifieds:4003/graphql
      - SUBGRAPH_ADMIN_URL=http://admin:4004/graphql
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      identity:
        condition: service_healthy
      events:
        condition: service_healthy
      classifieds:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

  identity:
    image: ghcr.io/techlumenyx/phoenix/subgraph-identity:staging
    ports:
      - "127.0.0.1:5001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - MONGO_URI=${MONGO_URI}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CL_MEDIA_ALLOWED_ORIGINS=${CL_MEDIA_ALLOWED_ORIGINS}
      - APP_SECRET=${APP_SECRET}
      - APP_URL=${APP_URL}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - ADMIN_INTERNAL_URL=http://admin:4004
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  events:
    image: ghcr.io/techlumenyx/phoenix/subgraph-events:staging
    ports:
      - "127.0.0.1:5002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
      - MONGO_URI=${MONGO_URI}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CL_MEDIA_ALLOWED_ORIGINS=${CL_MEDIA_ALLOWED_ORIGINS}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - ADMIN_INTERNAL_URL=http://admin:4004
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  classifieds:
    image: ghcr.io/techlumenyx/phoenix/subgraph-classifieds:staging
    ports:
      - "127.0.0.1:5003:4003"
    environment:
      - NODE_ENV=production
      - PORT=4003
      - MONGO_URI=${MONGO_URI}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CL_MEDIA_ALLOWED_ORIGINS=${CL_MEDIA_ALLOWED_ORIGINS}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - ADMIN_INTERNAL_URL=http://admin:4004
      - IDENTITY_INTERNAL_URL=http://identity:4001
      - AI_RISK_ENABLED=${AI_RISK_ENABLED:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  admin:
    image: ghcr.io/techlumenyx/phoenix/subgraph-admin:staging
    ports:
      - "127.0.0.1:5004:4004"
    environment:
      - NODE_ENV=production
      - PORT=4004
      - MONGO_URI=${MONGO_URI}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CL_MEDIA_ALLOWED_ORIGINS=${CL_MEDIA_ALLOWED_ORIGINS}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - IDENTITY_INTERNAL_URL=http://identity:4001
      - EVENTS_INTERNAL_URL=http://events:4002
      - CLASSIFIEDS_INTERNAL_URL=http://classifieds:4003
      - ADMIN_ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS}
      - ADMIN_RATE_LIMIT_PER_MINUTE=${ADMIN_RATE_LIMIT_PER_MINUTE:-120}
      - APP_VERSION=${APP_VERSION:-staging}
      - REDIS_URL=redis://redis:6379
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-sendgrid}
      - SENDGRID_WEBHOOK_PUBLIC_KEY=${SENDGRID_WEBHOOK_PUBLIC_KEY}
      - SQS_EVENT_QUEUE_URL=${SQS_EVENT_QUEUE_URL:-}
      - BREVO_WEBHOOK_TOKEN=${BREVO_WEBHOOK_TOKEN:-}
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS:-5}
      - EMAIL_RETRY_DELAY_MS=${EMAIL_RETRY_DELAY_MS:-5000}
      - AI_RISK_ENABLED=${AI_RISK_ENABLED:-false}
      - AI_RISK_PROVIDER=${AI_RISK_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AI_RISK_MAX_ATTEMPTS=${AI_RISK_MAX_ATTEMPTS:-3}
      - AI_RISK_RETRY_DELAY_MS=${AI_RISK_RETRY_DELAY_MS:-10000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 96m

  worker:
    image: ghcr.io/techlumenyx/phoenix/worker:staging
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - ADMIN_INTERNAL_URL=http://admin:4004
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-sendgrid}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME:-Christian Listings (Staging)}
      - SENDGRID_REPLY_TO=${SENDGRID_REPLY_TO}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - SES_FROM_EMAIL=${SES_FROM_EMAIL:-}
      - SES_FROM_NAME=${SES_FROM_NAME:-Christian Listings (Staging)}
      - SES_REPLY_TO=${SES_REPLY_TO:-}
      - SES_CONFIGURATION_SET=${SES_CONFIGURATION_SET:-}
      - SQS_EVENT_QUEUE_URL=${SQS_EVENT_QUEUE_URL:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:-}
      - BREVO_FROM_NAME=${BREVO_FROM_NAME:-Christian Listings (Staging)}
      - BREVO_REPLY_TO=${BREVO_REPLY_TO:-}
      - EMAIL_WORKER_CONCURRENCY=${EMAIL_WORKER_CONCURRENCY:-5}
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS:-5}
      - EMAIL_RETRY_DELAY_MS=${EMAIL_RETRY_DELAY_MS:-5000}
      - EMAIL_SCHEDULE_SCAN_MS=${EMAIL_SCHEDULE_SCAN_MS:-60000}
      - AI_RISK_ENABLED=${AI_RISK_ENABLED:-false}
      - AI_RISK_PROVIDER=${AI_RISK_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TIMEOUT_MS=${GEMINI_TIMEOUT_MS:-30000}
      - AI_RISK_WORKER_CONCURRENCY=${AI_RISK_WORKER_CONCURRENCY:-2}
      - AI_RISK_MAX_ATTEMPTS=${AI_RISK_MAX_ATTEMPTS:-3}
      - AI_RISK_RETRY_DELAY_MS=${AI_RISK_RETRY_DELAY_MS:-10000}
    depends_on:
      redis:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 192m

  # Staging intentionally has no MONGO_DB_SUFFIX — it targets the same
  # unsuffixed databases (cl_identity, etc.) that were already live in
  # Cluster0 before the christianlistings.com cutover.
  seed:
    profiles: ["tools"]
    image: ghcr.io/techlumenyx/phoenix/subgraph-identity:staging
    environment:
      - MONGO_URI=${MONGO_URI}
      - SEED_ENVIRONMENT=${SEED_ENVIRONMENT:-}
      - SEED_REMOTE_CONFIRM=${SEED_REMOTE_CONFIRM:-}
    volumes:
      - ./tools/scripts/seed-local-mongo.js:/app/tools/scripts/seed-local-mongo.js:ro
    command: ["node", "/app/tools/scripts/seed-local-mongo.js", "--remote"]
    restart: "no"

  seed-demo:
    profiles: ["tools"]
    image: ghcr.io/techlumenyx/phoenix/subgraph-identity:staging
    environment:
      - MONGO_URI=${MONGO_URI}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://christian-listings-stage.web.app}
      - SEED_ENVIRONMENT=${SEED_ENVIRONMENT:-}
      - SEED_REMOTE_CONFIRM=${SEED_REMOTE_CONFIRM:-}
      - DEMO_ORG_EMAIL=${DEMO_ORG_EMAIL:-}
      - DEMO_ORG_PASSWORD=${DEMO_ORG_PASSWORD:-}
      - DEMO_MEMBER_EMAIL=${DEMO_MEMBER_EMAIL:-}
      - DEMO_MEMBER_PASSWORD=${DEMO_MEMBER_PASSWORD:-}
    volumes:
      - ./tools/scripts/seed-production-demo.js:/app/tools/scripts/seed-production-demo.js:ro
    command: ["node", "/app/tools/scripts/seed-production-demo.js", "--production-demo"]
    restart: "no"

volumes:
  redis_data:
