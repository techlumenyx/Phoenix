# /etc/nginx/sites-available/christian-listings-staging.duckdns.org
#
# Mirrors the prod site config (christian-listings.duckdns.org) exactly,
# just pointed at the staging containers' host ports (5000-5004 instead
# of 4000-4004). Install as root, then run certbot — it will rewrite
# this file to add the SSL block + HTTP->HTTPS redirect automatically,
# the same way the prod config was originally provisioned.

server {
    listen 80;
    server_name christian-listings-staging.duckdns.org;

    # Event video uploads can be up to 200 MB.
    client_max_body_size 210M;

    # GraphQL gateway
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # Profile, organisation, and verification uploads
    location /media/identity/ {
        proxy_pass http://127.0.0.1:5001/media/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Event image and video uploads
    location /media/events/ {
        proxy_pass http://127.0.0.1:5002/media/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Marketplace media and CV uploads
    location /media/classifieds/ {
        proxy_pass http://127.0.0.1:5003/media/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Admin media uploads
    location /media/admin/ {
        proxy_pass http://127.0.0.1:5004/media/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /webhooks/sendgrid {
        proxy_pass http://127.0.0.1:5004/webhooks/sendgrid;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /webhooks/brevo {
        proxy_pass http://127.0.0.1:5004/webhooks/brevo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
