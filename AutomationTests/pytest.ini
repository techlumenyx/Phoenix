[pytest]
addopts = -ra --strict-markers
testpaths = tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
markers =
    smoke: fast production-safe smoke tests
    links: checks visible same-origin links
    auth: tests authenticated admin behavior
    navigation: tests navigation across application sections
    public: tests the public website
    admin: tests the administration website
    account_creation: creates a real organisation account and verifies it in admin
    org_login: signs in with an existing organisation account
    event_creation: creates a complete event and verifies it in admin
